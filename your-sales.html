<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Your Sales</title>
  <meta name="description" content="Your sales — yearly performance chart." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#191919" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stores" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app">

    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2C5.6 2 3 3.1 1 4.9L2.4 6.4C4 4.9 6.1 4 8.5 4s4.5.9 6.1 2.4L16 4.9C14 3.1 11.4 2 8.5 2Zm0 4c-1.6 0-3.1.6-4.2 1.6l1.5 1.5c.7-.7 1.7-1.1 2.7-1.1s2 .4 2.7 1.1l1.5-1.5C11.6 6.6 10.1 6 8.5 6Zm0 4-1.6 1.6c.4.4 1 .7 1.6.7s1.2-.3 1.6-.7L8.5 10Z"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="#cdf42a"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <div class="screen">

      <!-- Top bar -->
      <div class="topbar">
        <a class="icon-btn" href="index.html" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="title" style="font-size:24px">Your Sales</div>
        <button class="icon-btn" aria-label="Share">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M20 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
        </button>
      </div>

      <!-- Segmented control -->
      <div class="segment">
        <button>All</button>
        <button class="active">Year</button>
        <button>Month</button>
        <button>Week</button>
      </div>

      <!-- Chart -->
      <div class="card chart-card">
        <div class="chart-tags">
          <span class="tag">$ 311,056.00</span>
          <span class="tag lime">$ 385,990.30</span>
        </div>

        <div class="chart-wrap">
          <svg viewBox="0 0 360 170" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#cdf42a" stop-opacity="0.55"/>
                <stop offset="0.55" stop-color="#7fae1e" stop-opacity="0.20"/>
                <stop offset="1" stop-color="#cdf42a" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- Filled area -->
            <path d="M0,120 C30,112 48,86 78,90 C104,93 118,124 150,118
                     C176,113 188,64 214,60 C244,55 262,96 296,90
                     C322,86 340,74 360,70 L360,170 L0,170 Z"
                  fill="url(#area)"/>

            <!-- Main line -->
            <path d="M0,120 C30,112 48,86 78,90 C104,93 118,124 150,118
                     C176,113 188,64 214,60 C244,55 262,96 296,90
                     C322,86 340,74 360,70"
                  fill="none" stroke="#dbff54" stroke-width="2.5" stroke-linecap="round"/>

            <!-- Secondary dashed series -->
            <path d="M0,132 C34,128 50,110 82,110 C112,110 126,138 156,132
                     C182,127 196,96 222,92 C250,88 268,112 300,108
                     C326,105 342,98 360,96"
                  fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.6"
                  stroke-dasharray="2 5" stroke-linecap="round"/>

            <!-- Marker -->
            <line x1="214" y1="0" x2="214" y2="170" stroke="rgba(255,255,255,0.35)"
                  stroke-width="1.4" stroke-dasharray="2 4"/>
            <circle cx="214" cy="60" r="6" fill="#fff" stroke="#191919" stroke-width="2.5"/>
          </svg>
        </div>

        <div class="chart-nav">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-6 6 6 6M12 6l-6 6 6 6"/></svg>
        </div>
      </div>

      <!-- Month selector -->
      <div class="months" style="justify-content:space-between">
        <div class="month">may</div>
        <div class="month">jun</div>
        <div class="month active">jul</div>
        <div class="month">aug</div>
        <div class="month">sep</div>
      </div>

      <!-- Stats on blue card -->
      <div class="card profit-blue on-color" style="border-radius:var(--radius-lg);padding:6px 22px 22px;position:relative">
        <div class="stat-row">
          <div>
            <div class="stat-name">Average Sale Value</div>
            <div class="stat-figure"><span class="cur">$</span> 7,621,310.50</div>
            <div class="subtle">$155,291.400 less than last year.</div>
          </div>
          <span class="arrow-chip on-color"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
        </div>

        <div class="stat-row">
          <div>
            <div class="stat-name">Average Items per Sale</div>
            <div class="stat-figure">22.1</div>
            <div class="subtle">0.28 less than last year.</div>
          </div>
          <button class="arrow-chip" style="width:52px;height:52px;background:var(--lime);border-color:transparent;color:var(--on-lime);box-shadow:0 8px 22px rgba(205,244,42,.35)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </button>
        </div>
      </div>

    </div>

    <nav class="tabbar">
      <a href="index.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>
        <span>Home</span><span class="dot"></span>
      </a>
      <a href="sales-analyzing.html">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Analyzing</span><span class="dot"></span>
      </a>
      <a href="your-sales.html" class="active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 6-7"/><path d="M17 5h4v4"/></svg>
        <span>Sales</span><span class="dot"></span>
      </a>
      <a href="#">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        <span>Inventory</span><span class="dot"></span>
      </a>
    </nav>

  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
