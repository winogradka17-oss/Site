      </span>
    </div>

    <div class="screen">

      <!-- Top bar -->
      <div class="topbar">
        <a class="icon-btn" href="index.html" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="title grow" style="margin-left:4px">Sales<br>Analyzing</div>
        <button class="icon-btn solid" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg>
        </button>
      </div>

      <!-- Purchase orders -->
      <div class="mini-grid">
        <div class="mini">
          <div class="mini-head">
            <div class="mini-name">Purchase<br>Orders</div>
            <span class="arrow-chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
          </div>
          <div class="mini-value">2<small>sent</small></div>
        </div>
        <div class="mini">
          <div class="mini-head">
            <div class="mini-name">Purchase<br>Orders</div>
            <span class="arrow-chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
          </div>
          <div class="mini-value">3<small>dispatched</small></div>
        </div>
      </div>

      <!-- Profit cards -->
      <div class="stack" style="margin-top:2px">
        <!-- Gross profit -->
        <div class="card profit-card profit-blue rings on-color">
          <div class="profit-name">Gross Profit</div>
          <div class="metric"><span class="cur">$</span>177,349.50</div>
          <div class="subtle">$44,357.23 more than this<br>time last month.</div>
        </div>

        <!-- Floating link button -->
        <button class="link-fab" style="--pos:50%" aria-label="Details">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </button>

        <!-- Net profit -->
        <div class="card profit-card profit-lime rings">
          <div class="profit-name">Net Profit</div>
          <div class="metric"><span class="cur">$</span>331,224.74</div>
          <div class="subtle">$44,357.23 more than this<br>time last month.</div>
        </div>
      </div>

    </div>

    <nav class="tabbar">
      <a href="index.html">
